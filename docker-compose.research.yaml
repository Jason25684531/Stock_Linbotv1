name: stock-linbot-research
services:
  research:
    image: stock-linbot-research:public-data
    build:
      context: .
      dockerfile: Dockerfile.research
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      STOCK_LINBOT_MODE: research
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - type: bind
        source: ./outputs/research_budget
        target: /app/outputs/research_budget
      - type: bind
        source: ./outputs/research_budget/authorization
        target: /app/outputs/authorization
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=700
    command: [status]
