# pytest.ini - pytest 配置文件
# 此文件定義 pytest 的全域設定

[pytest]
# 測試檔案路徑
testpaths = test

# 確保直接使用 pytest 指令時也能匯入 repo 內模組
pythonpath = .

# Python 檔案命名規則
python_files = test_*.py

# 測試類別命名規則
python_classes = Test*

# 測試函數命名規則
python_functions = test_*

# 輸出格式
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# 標記（markers）定義
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    allow_real_backtest_persistence: opts out of the autouse save_backtest_results() guard; test must target an isolated database
